name: Build & Release Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Read version from package.json
        id: pkg
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies and build
        shell: pwsh
        run: |
          npm install
          Set-Location frontend
          npm install
          Set-Location ..\backend
          npm install
          Set-Location ..
          npm run build:all

      - name: Build Electron installer
        run: node scripts/build-desktop.js

      - name: Create or update GitHub Release and upload .exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pkg.outputs.version }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          # Find the installer .exe (exclude blockmap files)
          $exeFile = Get-ChildItem -Path "dist" -Filter "*.exe" |
                     Where-Object { $_.Name -notlike "*blockmap*" } |
                     Select-Object -First 1

          if (-not $exeFile) {
            Write-Host "::error::No .exe file found in dist/ directory!"
            Write-Host "Contents of dist/:"
            Get-ChildItem -Path "dist" -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          Write-Host "Found installer: $($exeFile.FullName)"
          Write-Host "File size: $([math]::Round($exeFile.Length / 1MB, 2)) MB"

          # Delete existing release for this tag if it exists (clean slate)
          Write-Host "Checking for existing release $env:TAG ..."
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Existing release found. Deleting it to recreate with latest build..."
            gh release delete $env:TAG --yes --cleanup-tag 2>$null
            # Small delay to allow GitHub to process the deletion
            Start-Sleep -Seconds 3
          } else {
            Write-Host "No existing release for $env:TAG."
          }

          # Create new release with the .exe attached
          Write-Host "Creating release $env:TAG and uploading $($exeFile.Name) ..."
          gh release create $env:TAG "$($exeFile.FullName)" `
            --title "SMR Groups Billing System v$env:VERSION" `
            --notes "Desktop installer for SMR Groups Billing System v$env:VERSION`n`nDownload the .exe file below to install." `
            --latest

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to create release and upload asset."
            exit 1
          }

          Write-Host "Release $env:TAG created and published successfully!"
